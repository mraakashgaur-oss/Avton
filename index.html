<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AVTON Ventures - Clean Energy &amp; EV Infrastructure</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{cyan:{400:'#22d3ee',500:'#06b6d4',600:'#0891b2',700:'#0e7490'}}}}}</script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--cyan:#22d3ee;--cyan-dim:#0e7490;--bg-card:rgba(15,23,42,0.85);--border:rgba(34,211,238,.18);--glow-sm:0 0 12px rgba(34,211,238,.35);--glow-md:0 0 28px rgba(34,211,238,.45)}
    html{scroll-behavior:smooth}
    body{font-family:system-ui,sans-serif;background:#030712}
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#030712}::-webkit-scrollbar-thumb{background:var(--cyan-dim);border-radius:3px}
    .glass{background:var(--bg-card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border)}
    .btn-cyan{background:linear-gradient(135deg,#06b6d4,#0891b2);color:#fff;border:none;padding:.6rem 1.4rem;border-radius:8px;font-weight:600;cursor:pointer;box-shadow:var(--glow-sm);transition:all .25s ease}
    .btn-cyan:hover{box-shadow:var(--glow-md);transform:translateY(-1px)}
    .btn-ghost{background:transparent;color:var(--cyan);border:1px solid var(--border);padding:.6rem 1.4rem;border-radius:8px;font-weight:500;cursor:pointer;transition:all .25s ease}
    .btn-ghost:hover{background:rgba(34,211,238,.08);border-color:var(--cyan)}
    .input-field{width:100%;padding:.65rem 1rem;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;color:#e5e7eb;font-size:.9rem;outline:none;transition:border-color .25s,box-shadow .25s}
    .input-field:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
    .input-field::placeholder{color:#6b7280}
    select.input-field option{background:#0f172a}
    .solution-card{background:var(--bg-card);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:16px;padding:1.75rem;transition:all .3s ease}
    .solution-card:hover{transform:translateY(-4px);border-color:rgba(34,211,238,.4);box-shadow:var(--glow-md)}
    .status-active{background:rgba(16,185,129,.15);color:#34d399;border:1px solid rgba(16,185,129,.3)}
    .status-next{background:rgba(245,158,11,.12);color:#fbbf24;border:1px solid rgba(245,158,11,.3)}
    .status-coming{background:rgba(139,92,246,.12);color:#a78bfa;border:1px solid rgba(139,92,246,.3)}
    .status-badge{padding:.2rem .65rem;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.04em}
    .tab-btn{padding:.6rem 1.4rem;border-radius:8px;font-weight:600;font-size:.9rem;cursor:pointer;border:1px solid transparent;transition:all .25s ease}
    .tab-btn.active{background:linear-gradient(135deg,#0e7490,#0891b2);color:#fff;border-color:var(--cyan);box-shadow:var(--glow-sm)}
    .tab-btn:not(.active){background:rgba(255,255,255,.04);color:#9ca3af;border-color:var(--border)}
    .badge-partner{display:inline-flex;align-items:center;gap:.45rem;background:rgba(6,182,212,.12);border:1px solid rgba(6,182,212,.4);border-radius:999px;padding:.3rem .85rem;font-size:.78rem;font-weight:600;color:var(--cyan);box-shadow:var(--glow-sm)}
    .asset-card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:1.25rem;transition:all .25s ease}
    .asset-card:hover{border-color:rgba(34,211,238,.3)}
    .warranty-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
    .warranty-fill{height:100%;border-radius:3px}
    .ticket-step{display:flex;gap:.85rem;position:relative}
    .ticket-step:not(:last-child)::before{content:'';position:absolute;left:15px;top:32px;width:2px;height:calc(100% + 8px);background:var(--border)}
    .step-dot{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}
    .step-dot.done{background:rgba(34,211,238,.2);border:2px solid var(--cyan);color:var(--cyan)}
    .step-dot.pend{background:rgba(255,255,255,.05);border:2px solid var(--border);color:#6b7280}
    .step-dot.inprog{background:rgba(245,158,11,.15);border:2px solid #fbbf24;color:#fbbf24}
    #chatbot-fab{position:fixed;bottom:1.5rem;right:1.5rem;z-index:200}
    .chat-bubble{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#06b6d4,#0284c7);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--glow-md);transition:transform .25s}
    .chat-bubble:hover{transform:scale(1.08)}
    .chat-window{position:absolute;bottom:72px;right:0;width:360px;max-height:520px;background:rgba(9,15,30,.97);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.6),var(--glow-md);display:flex;flex-direction:column}
    .chat-header{background:linear-gradient(135deg,#0e7490,#075985);padding:.9rem 1.1rem;display:flex;align-items:center;gap:.6rem}
    .chat-messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.75rem}
    .chat-input-row{padding:.75rem;border-top:1px solid var(--border);display:flex;gap:.5rem;align-items:flex-end}
    .chat-input-row textarea{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;color:#e5e7eb;font-size:.85rem;padding:.55rem .8rem;outline:none;resize:none;max-height:100px;font-family:inherit}
    .chat-input-row textarea:focus{border-color:var(--cyan)}
    .msg-bot{padding:.6rem .9rem;border-radius:14px;max-width:85%;font-size:.85rem;line-height:1.6;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.2);align-self:flex-start}
    .msg-user{padding:.6rem .9rem;border-radius:14px;max-width:85%;font-size:.85rem;line-height:1.6;background:rgba(6,182,212,.25);border:1px solid rgba(6,182,212,.3);align-self:flex-end}
    .ticket-cta-btn{background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.4);color:#fbbf24;border-radius:8px;padding:.45rem .8rem;font-size:.78rem;font-weight:600;cursor:pointer;width:100%;margin-top:.4rem;transition:all .25s}
    .ticket-cta-btn:hover{background:rgba(245,158,11,.25)}
    .section-label{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
    #navbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(3,7,18,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .grid-bg{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(34,211,238,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.04) 1px,transparent 1px);background-size:60px 60px}
    @keyframes pulse-cyan{0%,100%{box-shadow:0 0 8px rgba(34,211,238,.3)}50%{box-shadow:0 0 22px rgba(34,211,238,.7)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes bounce-dot{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
    .animate-float{animation:float 4s ease-in-out infinite}
    .animate-pulse-cyan{animation:pulse-cyan 2.5s ease-in-out infinite}
    .fade-up{animation:fadeInUp .6s ease forwards}
    @media(max-width:768px){.chat-window{width:calc(100vw - 2rem);right:-0.5rem}}
  </style>
</head>

<script>
// ── MOCK DATA ──────────────────────────────────────────────────────────────────

    {id:'CHG-003',name:'EV Eco Plug Compact 3.3kW',serial:'EVP-3K-2023-009917',location:'Office Fleet - Carport Bay 07',installed:'2023-11-20',warrantyExpiry:'2025-11-20',firmware:'v1.9.3',status:'offline',sessions:204,energyDelivered:'2,012 kWh',specs:{Power:'3.3 kW',Voltage:'230V AC',Current:'16A',Protection:'IP44, IK07'}}

// ── UTILS ──────────────────────────────────────────────────────────────────────
function warrantyPct(a){const i=new Date(a.installed),e=new Date(a.warrantyExpiry),n=new Date(),t=e-i,l=Math.min(n-i,t);return Math.max(0,Math.round((1-l/t)*100))}
function warrantyColor(p){return p>60?'#22d3ee':p>25?'#fbbf24':'#f87171'}
function daysLeft(e){return Math.max(0,Math.ceil((new Date(e)-new Date())/86400000))}
function mdToHtml(t){return t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>').replace(/^- (.+)$/gm,'<span style="display:block;padding-left:1em">- $1</span>').replace(/\|(.+?)\|(.+?)\|/g,(_,a,b)=>`<div style="display:flex;gap:8px;font-size:.8em;margin:.2em 0"><span style="padding:.15em .5em;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.1);min-width:80px">${a.trim()}</span><span style="padding:.15em .5em;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.1)">${b.trim()}</span></div>`)}

// ── STATE ──────────────────────────────────────────────────────────────────────
let currentView='public';
const app=document.getElementById('app');
function switchView(v){currentView=v;renderNavbar();v==='public'?renderPublicView():renderPortalView();window.scrollTo({top:0,behavior:'smooth'})}

// ── NAVBAR ─────────────────────────────────────────────────────────────────────
function renderNavbar(){
  const old=document.getElementById('navbar');if(old)old.remove();
  const nav=document.createElement('nav');nav.id='navbar';
  nav.innerHTML=`<div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">

      <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#06b6d4,#0284c7);display:flex;align-items:center;justify-content:center;animation:pulse-cyan 3s infinite">

    </div>

        Client Portal

          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:2.5rem;padding-top:2rem;border-top:1px solid var(--border)">
            ${[['500+','Chargers Deployed'],['98.6%','Uptime SLA'],['3 MW+','Solar Capacity']].map(([v,l])=>`
              <div>
                <div style="font-size:1.6rem;font-weight:900;color:#fff">${v}</div>
                <div style="font-size:.75rem;color:#6b7280;margin-top:.2rem">${l}</div>
              </div>`).join('')}
          </div>
        </div>
        <!-- Charger Visual Card -->
        <div style="display:flex;justify-content:center" class="hidden lg:flex">
          <div class="glass animate-float" style="border-radius:24px;padding:2rem;max-width:340px;width:100%;box-shadow:var(--glow-md);position:relative">
            <div style="display:flex;justify-content:center;margin-bottom:1.5rem">

  main.appendChild(hero);

  // SOLUTIONS

        <div style="margin-bottom:1rem"><label style="display:block;font-size:.75rem;font-weight:600;color:#9ca3af;margin-bottom:.4rem">Description *</label>
          <textarea class="input-field" id="tk-desc" rows="4" placeholder="Describe the issue in detail..." required style="resize:vertical"></textarea>
        </div>
        <div style="margin-bottom:1.25rem">
          <label style="display:block;font-size:.75rem;font-weight:600;color:#9ca3af;margin-bottom:.6rem">Severity</label>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem">
            ${[['Low','Low Priority'],['Medium','Charging Disrupted'],['High','Site Critical']].map(([l,h],i)=>`
              <label style="cursor:pointer">
                <input type="radio" name="sev" value="${l}" style="display:none" ${i===1?'checked':''}>
                <div class="sev-opt" data-lv="${l}" style="text-align:center;padding:.6rem;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#6b7280;font-size:.78rem;font-weight:600;cursor:pointer">
                  ${l}<br><span style="font-size:.65rem;opacity:.6">${h}</span>
                </div>
              </label>`).join('')}
          </div>
        </div>
        <div style="margin-bottom:1.25rem">
          <label style="display:block;font-size:.75rem;font-weight:600;color:#9ca3af;margin-bottom:.6rem">Attach Files (optional)</label>
          <label style="display:flex;flex-direction:column;align-items:center;padding:1.5rem;border:2px dashed rgba(34,211,238,.2);border-radius:12px;cursor:pointer;background:rgba(34,211,238,.02)" onmouseover="this.style.borderColor='rgba(34,211,238,.4)'" onmouseout="this.style.borderColor='rgba(34,211,238,.2)'">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" style="margin-bottom:.5rem;opacity:.6"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span style="font-size:.8rem;color:#6b7280">Drop files or <span style="color:#22d3ee">browse</span></span>
            <span style="font-size:.7rem;color:#4b5563;margin-top:.2rem">PNG, JPG, PDF, MP4 - Max 25MB</span>
            <input type="file" style="display:none" id="tk-file" multiple>
          </label>
          <div id="tk-file-list" style="margin-top:.5rem"></div>
        </div>
        <div style="display:flex;gap:.75rem">
          <button type="submit" class="btn-cyan" style="flex:1;padding:.8rem">Submit Ticket</button>
          <button type="button" class="btn-ghost" onclick="document.querySelector('[data-tab=tickets]').click()">Cancel</button>
        </div>
        <div id="tk-success" style="display:none;text-align:center;padding:1.5rem;border-radius:12px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.25);margin-top:1rem">
          <div style="font-size:2rem;margin-bottom:.5rem">&#10003;</div>
          <div style="color:#34d399;font-weight:700">Ticket Created!</div>
          <div style="color:#6b7280;font-size:.82rem;margin-top:.3rem">Our team will respond within 4 business hours.</div>
        </div>
      </form>
    </div>
  </div>`;
}

function wireTicketForm(ctx){
  ctx.querySelector('#tk-file')?.addEventListener('change',function(){
    ctx.querySelector('#tk-file-list').innerHTML=[...this.files].map(f=>`<div style="font-size:.72rem;color:#6b7280;padding:.2rem 0">&#128206; ${f.name} (${(f.size/1024).toFixed(1)} KB)</div>`).join('');
  });
  const update=()=>{
    const sel=ctx.querySelector('input[name="sev"]:checked')?.value;
    ctx.querySelectorAll('.sev-opt').forEach(o=>{
      const a=o.dataset.lv===sel;
      o.style.borderColor=a?'rgba(34,211,238,.5)':'rgba(255,255,255,.08)';
      o.style.background=a?'rgba(34,211,238,.1)':'rgba(255,255,255,.03)';
      o.style.color=a?'#22d3ee':'#6b7280';
    });
  };
  ctx.querySelectorAll('input[name="sev"]').forEach(r=>{r.addEventListener('change',update)});
  ctx.querySelectorAll('.sev-opt').forEach(o=>{o.addEventListener('click',()=>{const r=ctx.querySelector(`input[value="${o.dataset.lv}"]`);if(r){r.checked=true;r.dispatchEvent(new Event('change'))}})});
  update();
  ctx.querySelector('#ticket-form')?.addEventListener('submit',e=>{
    e.preventDefault();
    if(!ctx.querySelector('#tk-asset').value||!ctx.querySelector('#tk-cat').value||!ctx.querySelector('#tk-desc').value.trim()){alert('Please fill all required fields.');return}
    const b=e.target.querySelector('[type="submit"]');b.textContent='Submitting...';b.disabled=true;
    setTimeout(()=>{e.target.querySelectorAll('div:not(#tk-success),label,button').forEach(el=>el.style.display='none');ctx.querySelector('#tk-success').style.display='block'},1200);
  });
}

// ── CHATBOT ────────────────────────────────────────────────────────────────────
function renderChatbot(){
  const fab=document.createElement('div');fab.id='chatbot-fab';
  fab.innerHTML=`
    <button class="chat-bubble" id="chat-toggle" title="EcoAssist AI">
      <svg id="ico-open" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      <svg id="ico-close" style="display:none" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div id="chat-badge" style="position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:#ef4444;font-size:.65rem;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center">1</div>
    <div id="chat-win" style="display:none" class="chat-window">
      <div class="chat-header">
        <div style="width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <div style="flex:1">
          <div style="font-weight:700;color:#fff;font-size:.9rem">EcoAssist AI</div>
          <div style="color:#a5f3fc;font-size:.7rem">EV Charging Expert - Always available</div>
        </div>
        <div style="display:flex;align-items:center;gap:.4rem">
          <div style="width:7px;height:7px;border-radius:50%;background:#34d399;animation:pulse-cyan 2s infinite"></div>
          <span style="font-size:.68rem;color:#6ee7b7">Live</span>
        </div>
      </div>
      <div class="chat-messages" id="chat-msgs"></div>
      <div id="chat-sugg" style="padding:.5rem .75rem .25rem;display:flex;flex-wrap:wrap;gap:.4rem">
        ${['AC vs DC?','kW explained','Phase loading','Charger offline!','OCPP?','Warranty?'].map(s=>`<button style="font-size:.72rem;padding:.25rem .65rem;border-radius:999px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.2);color:#22d3ee;cursor:pointer" onclick="chatSend(this.textContent)">${s}</button>`).join('')}
      </div>
      <div class="chat-input-row">
        <textarea id="chat-input" rows="1" placeholder="Ask about EV charging..."></textarea>
        <button class="btn-cyan" style="padding:.5rem .75rem;flex-shrink:0" onclick="chatSend(document.getElementById('chat-input').value)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>`;
  document.body.appendChild(fab);

  let open=false;
  fab.querySelector('#chat-toggle').onclick=()=>{
    open=!open;
    fab.querySelector('#chat-win').style.display=open?'flex':'none';
    fab.querySelector('#ico-open').style.display=open?'none':'';
    fab.querySelector('#ico-close').style.display=open?'':'none';
    const badge=fab.querySelector('#chat-badge');if(badge)badge.remove();
    if(open)setTimeout(()=>document.getElementById('chat-input')?.focus(),100);
  };
  fab.querySelector('#chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();chatSend(e.target.value)}});
  setTimeout(()=>chatAddMsg('bot','Hello! I am **EcoAssist AI** - your EV charging expert.\n\nAsk me about AC/DC charging, kW levels, phase loading, OCPP, or charger troubleshooting. I can also raise an OEM support ticket directly from here!'),300);
}

window.chatSend=function(text){
  if(!text?.trim())return;
  chatAddMsg('user',text);
  const inp=document.getElementById('chat-input');if(inp)inp.value='';
  const sugg=document.getElementById('chat-sugg');if(sugg)sugg.style.display='none';
  const msgs=document.getElementById('chat-msgs');
  const typing=document.createElement('div');typing.className='msg-bot';typing.id='typing';
  typing.innerHTML=`<span style="display:inline-flex;gap:4px">
    <span style="width:7px;height:7px;border-radius:50%;background:#22d3ee;animation:bounce-dot 1.2s 0s infinite ease-in-out"></span>
    <span style="width:7px;height:7px;border-radius:50%;background:#22d3ee;animation:bounce-dot 1.2s .2s infinite ease-in-out"></span>
    <span style="width:7px;height:7px;border-radius:50%;background:#22d3ee;animation:bounce-dot 1.2s .4s infinite ease-in-out"></span>
  </span>`;
  if(msgs){msgs.appendChild(typing);msgs.scrollTop=msgs.scrollHeight}
  setTimeout(()=>{
    document.getElementById('typing')?.remove();
    const lower=text.toLowerCase();
    const match=mockData.faq.find(f=>f.triggers.some(t=>lower.includes(t)));
    if(match)chatAddMsg('bot',match.response,match.showCTA);
    else if(/^(hi|hello|hey|namaste)/i.test(lower))chatAddMsg('bot','Hello! I am **EcoAssist AI**.\n\nI can help with:\n- AC vs DC charging\n- kW power levels\n- Phase loading\n- OCPP protocol\n- Charger troubleshooting\n\nWhat do you need?');
    else if(lower.includes('ticket')||lower.includes('support'))chatAddMsg('bot','I can raise a support ticket for you right now.',true);
    else chatAddMsg('bot','Not sure about that. Try asking about:\n\n- **AC** or **DC** - charging types\n- **kW** - power levels\n- **phase** - load management\n- **OCPP** - smart protocol\n- **offline** - troubleshooting');
  },600+Math.random()*500);
};

function chatAddMsg(role,text,showCTA=false){
  const msgs=document.getElementById('chat-msgs');if(!msgs)return;
  const d=document.createElement('div');d.className=role==='bot'?'msg-bot':'msg-user';
  d.innerHTML=mdToHtml(text);
  if(showCTA){
    const btn=document.createElement('button');btn.className='ticket-cta-btn';btn.textContent='Raise OEM Support Ticket';
    btn.onclick=()=>{
      const win=document.getElementById('chat-win');if(win)win.style.display='none';
      switchView('portal');
      setTimeout(()=>document.querySelector('[data-tab="new-ticket"]')?.click(),1500);
    };
    d.appendChild(btn);
  }
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
}

// ── INIT ───────────────────────────────────────────────────────────────────────
renderNavbar();
renderPublicView();
renderChatbot();
</script>
